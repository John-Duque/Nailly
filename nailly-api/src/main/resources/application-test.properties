# Test profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:fase2testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Necessário para os testes da nailly-api:
# as migrations do Flyway são escritas para o MySQL; no H2 as tabelas vêm das entidades.
spring.flyway.enabled=false
# Mantém o banco acima nos @DataJpaTest (por padrão eles trocariam por outro banco embutido).
spring.test.database.replace=none
# Segredo só de teste. O H2 só existe no classpath de teste, então este perfil não sobe fora dos testes.
nailly.security.jwt.secret=segredo-de-teste-com-pelo-menos-32-bytes
nailly.security.jwt.expiration=PT1H
nailly.scheduling.enabled=false
