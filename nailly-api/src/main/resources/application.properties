# Configuração comum a todos os ambientes.
# Segredos vêm sempre de variáveis de ambiente, sem valor padrão: DB_PASSWORD e JWT_SECRET
# (veja nailly-api/.env.example).
# Os perfis dev, staging e prod só ajustam comportamento, nunca segredo; o perfil test é dos testes.
spring.application.name=nailly-api

# Na máquina local essas variáveis vêm do arquivo nailly-api/.env (fora do Git).
# Nos servidores não existe .env: as variáveis vêm do ambiente.
spring.config.import=optional:file:.env[.properties]

# Endereço e usuário apontam para o MySQL do Docker local (container nailly-mysql) quando
# DB_URL e DB_USERNAME não estão definidas. Nos servidores, essas variáveis são obrigatórias.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nailly?allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
# O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
# Datas e horas de agendamento são gravadas em UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Aplica as migrations de src/main/resources/db/migration na subida.
spring.flyway.enabled=true

# Segredo que assina os tokens (mínimo de 32 caracteres).
nailly.security.jwt.secret=${JWT_SECRET}
# Validade do token de acesso; depois disso é preciso logar de novo.
nailly.security.jwt.expiration=PT8H

# Rotina que expira os pedidos PENDING que a profissional não respondeu a tempo.
nailly.scheduling.enabled=true
nailly.scheduling.expire-pending-delay=PT1M
