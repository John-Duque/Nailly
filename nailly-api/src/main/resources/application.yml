spring:
  application:
    name: nailly-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Datas e horas de agendamento são gravadas em UTC.
          time_zone: UTC

  flyway:
    enabled: true

# API aberta só no perfil local, até a autenticação JWT existir (ver SecurityConfig).
nailly:
  security:
    open-endpoints: false
