# Ambiente de produção (branch main). Variáveis de ambiente vêm do GitHub Environment "production".
logging.level.root=WARN
logging.level.com.nailly=INFO

# Já é o padrão do Spring Boot; fica explícito para produção nunca expor detalhes de erro.
server.error.include-message=never
server.error.include-stacktrace=never
