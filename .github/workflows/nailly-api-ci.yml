name: Nailly API CI

on:
  push:
    branches: [main]
    paths:
      - "nailly-api/**"
      - ".github/workflows/nailly-api-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nailly-api/**"
      - ".github/workflows/nailly-api-ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nailly-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    name: Build, testes e Sonar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nailly-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache do Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build e testes (com cobertura JaCoCo)
        run: mvn -B verify

      - name: Análise Sonar
        # PRs vindos de forks não têm acesso aos secrets
        if: github.event.pull_request.head.repo.fork != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true
