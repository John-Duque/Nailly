name: Nailly API CI

on:
  push:
    branches: [main]
    paths:
      - "nailly-api/**"
      - ".github/workflows/nailly-api-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nailly-api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-analyze:
    name: Build, testes e Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    defaults:
      run:
        working-directory: nailly-api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo

      # Java 21 é exigido pelo scanner do Sonar; Java 17 compila e testa o projeto.
      # O último JDK listado vira o JAVA_HOME padrão (17); o scan usa JAVA_HOME_21_X64.
      - name: Configurar JDKs (21 para o Sonar, 17 para o build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17
          cache: maven

      - name: Cache do Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build e testes (com cobertura JaCoCo)
        run: ./mvnw -B verify

      - name: Guardar relatórios de teste (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: nailly-api/target/surefire-reports
          if-no-files-found: ignore

      - name: Análise Sonar
        # Só roda se o token existir (não existe em forks nem em PRs do Dependabot)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true
