# ============================================================
# Pipeline de CI da API (nailly-api)
# Build, testes e análise de qualidade no Sonar.
# ============================================================
name: Nailly API CI

on:
  # Push nas branches de ambiente, só se a API (ou este arquivo) mudou
  push:
    branches: [develop, staging, main]
    paths:
      - "nailly-api/**"
      - ".github/workflows/nailly-api-ci.yml"
  # Todo PR para as branches de ambiente. Sem filtro de pastas de propósito:
  # o check é obrigatório e não pode ficar esperando num PR só de documentação.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Em PR, um push novo cancela a execução antiga. Nas branches de ambiente nunca cancela.
concurrency:
  group: nailly-api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-analyze:
    # Este nome é check obrigatório nos rulesets. Não mude.
    name: Build, testes e Sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    defaults:
      run:
        working-directory: nailly-api

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo

      # Java 21 é exigido pelo scanner do Sonar; Java 17 compila e testa o projeto.
      - name: Configurar JDKs (21 para o Sonar, 17 para o build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17
          cache: maven

      - name: Cache do Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build e testes (com cobertura JaCoCo)
        run: ./mvnw -B verify

      - name: Guardar relatórios de teste (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: nailly-api/target/surefire-reports
          if-no-files-found: ignore

      # Roda nos PRs para a develop (portão de qualidade do código novo) e no push
      # da main (referência do projeto). Os PRs de promoção (develop -> staging ->
      # main) reaproveitam o que já foi aprovado na develop.
      - name: Análise Sonar
        if: ${{ env.SONAR_TOKEN != '' && ((github.event_name == 'pull_request' && github.base_ref == 'develop') || github.ref == 'refs/heads/main') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true
